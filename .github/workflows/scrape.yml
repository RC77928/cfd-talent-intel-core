name: Weekly ATS scrape

# Monday 08:30 Asia/Taipei = Monday 00:30 UTC. Same cadence as the legacy
# eu-latam / mena dashboards, so the three feeds refresh together.
on:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch: {}

concurrency:
  group: cfd-talent-intel-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run ATS scraper
        run: node run.js --verbose

      - name: Show output summary
        run: |
          for region in eu latam mena apac propfirm; do
            f=data/${region}.json
            if [ -f "$f" ]; then
              count=$(node -e "const p=JSON.parse(require('fs').readFileSync('$f','utf8'));console.log(p.record_count+'/'+p.records.reduce((s,r)=>s+r.count,0))")
              echo "  $region: $count (records/jobs)"
            fi
          done

      - name: Commit refreshed data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "no data change — skipping commit"
          else
            git commit -m "chore(data): ats refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
